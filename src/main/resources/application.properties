spring.application.name=mcp-server-tdea

# MCP Stdio (Claude Desktop)
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=banking-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Logs solo a archivo (stdout es exclusivo para JSON-RPC MCP)
logging.pattern.console=
logging.file.name=${user.home}/mcp-banking/banking-mcp-server.log

# H2 file DB
spring.datasource.url=jdbc:h2:file:${user.home}/mcp-banking/bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
